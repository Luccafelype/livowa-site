<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Livowa</title>
<style>body{margin:0;background:#0e1311;color:#e7ede9;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}a{color:#52c99c}</style>
</head>
<body>
<noscript><a href="/idade/">Continuar</a></noscript>
<script type="module">
// Link da bio e do Direct: um endereço, vários testes. Desde 01/11 o Lucca escolhe o tema e a % de cada teste na aba
// Portas da consulta privada (tabela public.rotas, lida pela RPC pública rota_ler). Se o banco não responder em 1,5 s,
// vale a RESERVA abaixo (o estado de 31/10).
//   ?canal=direct   usa a rota do Direct (as campanhas do OpenReply mandam assim); sem canal = bio
//   ?camp=PERNAS    a campanha pode ter um teste fixo (definido na aba Portas) ou seguir as % do Direct
//   ?f=<id>         força um teste (link mandado à mão)
import * as Analytics from './funnel-analytics.js';
const SUPA = 'https://vfzbtnrqbdkfjzhqkiiu.supabase.co', CHAVE = 'sb_publishable_YD3iJdsZlE3gjXM1DdmszA_G9mDNf-K';
const DESTINOS = {
  longevidade: { pele:'/idade/?pele=1', quiz:'/longevidade/', teste:'/idade/', braco:'/braco/' },
  emagrecimento: {},   // nenhuma isca de emagrecimento no ar ainda
};
const RESERVA = {
  bio:    { tema:'longevidade', pesos:{ pele:50, quiz:50, teste:0, braco:0 }, fixo:null },
  direct: { tema:'longevidade', pesos:{ pele:25, quiz:25, teste:25, braco:25 }, fixo:null },
};
const CAMP_RESERVA = { PERNAS:'teste', MUSCULO:'braco', PELE:'pele', IDADE:'quiz' };
const q = new URLSearchParams(location.search);
const canal = q.get('canal') === 'direct' ? 'direct' : 'bio', camp = (q.get('camp') || '').toUpperCase() || null;

async function lerRota(){
  try {
    const r = await fetch(SUPA + '/rest/v1/rpc/rota_ler', { method:'POST', signal: AbortSignal.timeout(1500),
      headers:{ apikey: CHAVE, 'Content-Type':'application/json' }, body: JSON.stringify({ p_canal: canal, p_camp: camp }) });
    if (!r.ok) throw 0;
    const j = await r.json();
    if (!j || !DESTINOS[j.tema]) throw 0;
    return { tema: j.tema, pesos: j.pesos || {}, fixo: j.fixo || null, fonte:'banco' };
  } catch { const x = RESERVA[canal]; return { ...x, fixo: camp ? (CAMP_RESERVA[camp] || null) : null, fonte:'reserva' }; }
}
const rota = await lerRota();
let tema = rota.tema, cat = DESTINOS[tema];
let lista = Object.entries(rota.pesos).filter(([id, p]) => cat[id] && p > 0);
if (!lista.length){ tema = 'longevidade'; cat = DESTINOS.longevidade; lista = Object.entries(RESERVA.bio.pesos).filter(([, p]) => p > 0); }   // tema sem isca: não deixa a pessoa sem destino
const todos = { ...DESTINOS.longevidade, ...DESTINOS.emagrecimento };
const chave = 'livowa_braco_' + canal + '_' + tema;
let id = q.get('f');
if (!todos[id]) id = rota.fixo && todos[rota.fixo] ? rota.fixo : null;
if (!id){
  try { id = localStorage.getItem(chave); } catch {}
  if (!lista.some(([b]) => b === id)){   // teste que saiu da divisão não prende mais a pessoa
    let r = Math.random() * lista.reduce((a, [, p]) => a + p, 0);
    id = lista.find(([, p]) => (r -= p) < 0)[0];
  }
  try { localStorage.setItem(chave, id); } catch {}
}
const url = todos[id];
Analytics.init({ enabled:true, funnelId:'link-bio', variant:id, supabaseUrl:SUPA, supabaseKey:CHAVE });
Analytics.track('view', { stepId:'roteador', valueText:`${canal}:${tema}${camp ? ':' + camp : ''}:${rota.fonte}` });
['f', 'canal', 'camp'].forEach(x => q.delete(x)); q.set('v', id);   // sem ?sid: cada funil abre a própria sessão
if (!q.has('utm_source')) q.set('utm_source', canal === 'direct' ? 'ig_direct' : 'ig_bio');
if (camp && !q.has('utm_campaign')) q.set('utm_campaign', camp.toLowerCase());
// o sid da bio fica na aba; apagar para o funil abrir sessão nova e não cair na linha 'link-bio' do resumo
setTimeout(() => { try { sessionStorage.removeItem('livowa_sid'); } catch {} location.replace(url + (url.includes('?') ? '&' : '?') + q); }, 150);   // dá tempo do evento sair (keepalive)
</script>
</body>
</html>
