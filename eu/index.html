<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Este aparelho</title>
<style>
:root{--bg:#f4f2ec;--ink:#1b1b18;--muted:#5d5b53;--accent:#0f6b4f;--line:#d9d5ca}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--ink:#ecebe6;--muted:#a9a69c;--accent:#4fbf93;--line:#34332e}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
main{max-width:420px;padding:24px 16px}h1{font-size:1.5rem;margin:0 0 8px}p{color:var(--muted);margin:0 0 16px}
button{font:600 1rem inherit;padding:14px 18px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);width:100%}
.ok{color:var(--accent)}
</style></head><body><main>
<h1 id="t">…</h1><p id="s"></p>
<p>Vale só para este navegador. Abra este mesmo link no Safari, no navegador do Instagram e no do WhatsApp, se for testar por eles.</p>
<button id="b" type="button"></button>
</main>
<script>
const $ = id => document.getElementById(id);
function ler(){ try { return localStorage.getItem('livowa_eu') === '1'; } catch (e) { return null; } }
function mostrar(){
  const eu = ler();
  if (eu === null){ $('t').textContent = 'Este navegador não deixa marcar'; $('s').textContent = 'Está em modo privado? Abra numa janela normal.'; $('b').hidden = true; return; }
  $('t').innerHTML = eu ? '<span class="ok">Marcado:</span> este aparelho é seu' : 'Este aparelho conta como público';
  $('s').textContent = eu ? 'Os testes feitos aqui ficam fora da aba Funil e da Caixa (aparecem só em Origem › Testes).' : 'Toque abaixo para marcar como seu e tirar os seus testes da conta.';
  $('b').textContent = eu ? 'Voltar a contar este aparelho' : 'Marcar como meu';
}
$('b').addEventListener('click', () => { try { ler() ? localStorage.removeItem('livowa_eu') : localStorage.setItem('livowa_eu', '1'); } catch (e) {} mostrar(); });
try { localStorage.setItem('livowa_eu', '1'); } catch (e) {}
mostrar();
</script>
</body></html>
