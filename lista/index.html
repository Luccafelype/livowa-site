<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script>if(location.protocol==='http:')location.replace(location.href.replace('http:','https:'));</script>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de compras | Livowa</title>
    <meta name="description" content="Lista de compras compartilhada via Livowa.">
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 104 115'%3E%3Crect width='104' height='115' rx='8' fill='%230B1117'/%3E%3Cpath d='M29.86 75.29C29.85 60.32 29.79 45.83 29.83 31.35C29.84 26.91 29.73 22.62 25 19.13C31.2 17.73 37.39 16.32 43.21 15C39.33 35.16 41.87 55.03 41.35 74.76C41.07 85.2 40.31 86.5 28.93 89.67C29.8 84.92 29.8 80.35 29.86 75.29Z' fill='%2300D9A6'/%3E%3Cpath d='M77.26 100.07C59.67 98.61 42.48 97.52 25.6 99.59C24.38 97.32 25.2 96.31 26.43 95.58C35.16 90.4 44.13 86.4 54.77 88.47C59.15 89.32 63.7 89.66 68.17 89.65C74.38 89.65 80.01 87.9 83.77 82.35C84.46 81.32 84.94 79.84 86.67 80.01C88.67 84.54 82.94 97.25 77.26 100.07Z' fill='%2300D9A6'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <style>
        .lc-wrap { max-width: 720px; margin: 0 auto; padding: 1rem; }
        .lc-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
        .lc-header-row { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .lc-meta { color: var(--color-text-light); font-size: 0.875rem; }
        .lc-section-title { color: var(--color-primary); font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin: 1.5rem 0 0.75rem; }
        .lc-item { display: flex; align-items: center; gap: 0.875rem; padding: 0.75rem 0; border-bottom: 1px solid var(--color-border); }
        .lc-item:last-child { border-bottom: none; }
        .lc-checkbox { flex-shrink: 0; width: 24px; height: 24px; border: 2px solid var(--color-border); border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s ease; background: var(--color-bg-main); }
        .lc-checkbox.checked { background: var(--color-secondary); border-color: var(--color-secondary); }
        .lc-checkbox.checked::after { content: ""; width: 12px; height: 6px; border-left: 2px solid #04130E; border-bottom: 2px solid #04130E; transform: rotate(-45deg) translate(2px, -2px); }
        .lc-checkbox:disabled { opacity: 0.5; cursor: wait; }
        .lc-item-body { flex: 1; min-width: 0; }
        .lc-item-name { font-weight: 500; color: var(--color-primary); }
        .lc-item.checked .lc-item-name { text-decoration: line-through; color: var(--color-text-light); }
        .lc-item-meta { color: var(--color-text-light); font-size: 0.875rem; margin-top: 2px; }
        .lc-refresh { display: inline-flex; align-items: center; gap: 0.5rem; }
        .lc-error { color: var(--color-danger); background: var(--color-danger-bg); border: 1px solid var(--color-danger); padding: 1rem; border-radius: 8px; }
        .lc-empty { text-align: center; color: var(--color-text-light); padding: 2rem; }
        .lc-progress { background: var(--color-bg-main); border-radius: 999px; height: 8px; overflow: hidden; margin-top: 0.75rem; }
        .lc-progress-bar { background: var(--color-secondary); height: 100%; transition: width 0.3s ease; width: 0%; }
        .lc-btn-small { padding: 0.5rem 0.875rem; font-size: 0.875rem; border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-bg-card); cursor: pointer; color: var(--color-text-main); }
        .lc-btn-small:hover { background: var(--color-bg-main); }
        .lc-loading { text-align: center; padding: 3rem 1rem; color: var(--color-text-light); }
        .lc-badge { display: inline-block; font-size: 0.7rem; font-weight: 600; padding: 0.15rem 0.55rem; border-radius: 999px; background: var(--color-badge-bg); color: var(--color-badge-text); margin-left: 0.5rem; }
    </style>
</head>
<body>
    <header class="container">
        <a href="/" class="logo">Livowa</a>
        <nav>
            <a href="/suporte">Suporte</a>
            <a href="/privacidade">Privacidade</a>
        </nav>
    </header>

    <main>
        <div class="lc-wrap">
            <div class="lc-card">
                <div class="lc-header-row">
                    <div>
                        <h1 style="font-size: 1.5rem;">Lista de compras</h1>
                        <p class="lc-meta" id="lc-subtitle">via Livowa</p>
                    </div>
                    <button class="lc-btn-small lc-refresh" id="lc-refresh" type="button">
                        Atualizar
                    </button>
                </div>
                <div class="lc-progress"><div class="lc-progress-bar" id="lc-progress-bar"></div></div>
                <p class="lc-meta" id="lc-progress-text" style="margin-top: 0.5rem;">Carregando...</p>
            </div>

            <div id="lc-content">
                <div class="lc-loading">Carregando lista...</div>
            </div>

            <p class="lc-meta" style="text-align: center; margin-top: 2rem;">
                Quer um plano pra você? <a href="/" style="color: var(--color-secondary); font-weight: 600;">Conheça a Livowa</a>
            </p>
        </div>
    </main>

    <!-- Supabase JS SDK (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
    <script>
        // ----- Config -----
        const SUPABASE_URL = 'https://vfzbtnrqbdkfjzhqkiiu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_YD3iJdsZlE3gjXM1DdmszA_G9mDNf-K';
        const POLL_INTERVAL_MS = 30000;

        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ----- Token extraction -----
        // URL patterns supported:
        //   /lista/{token}          (canonical)
        //   /lista/?token={token}   (fallback used by 404.html redirect)
        //   /lista/index.html?token={token}
        function extractToken() {
            const qs = new URLSearchParams(location.search);
            const fromQuery = qs.get('token');
            if (fromQuery) return fromQuery.trim();

            // Pathname pattern: /lista/{token} (last non-empty segment after "lista")
            const parts = location.pathname.split('/').filter(Boolean);
            const idx = parts.indexOf('lista');
            if (idx >= 0 && parts[idx + 1] && parts[idx + 1] !== 'index.html') {
                return parts[idx + 1];
            }
            return null;
        }

        const token = extractToken();

        // ----- DOM helpers -----
        const $content = document.getElementById('lc-content');
        const $progressBar = document.getElementById('lc-progress-bar');
        const $progressText = document.getElementById('lc-progress-text');
        const $subtitle = document.getElementById('lc-subtitle');
        const $refreshBtn = document.getElementById('lc-refresh');

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function showError(msg) {
            $content.innerHTML = `<div class="lc-error">${escapeHtml(msg)}</div>`;
            $progressText.textContent = '';
            $progressBar.style.width = '0%';
        }

        // ----- State -----
        let listaId = null;
        let itens = [];
        let marcados = new Set();

        // ----- Render -----
        function render() {
            if (!itens || itens.length === 0) {
                $content.innerHTML = '<div class="lc-card"><div class="lc-empty">Esta lista está vazia.</div></div>';
                $progressText.textContent = 'Sem itens.';
                $progressBar.style.width = '0%';
                return;
            }

            // Group by section
            const groupOrder = ['Hortifruti', 'Açougue', 'Peixaria', 'Frios', 'Laticínios', 'Mercearia', 'Bebidas', 'Outros', 'Variar', 'Recompensa'];
            const groups = {};
            for (const item of itens) {
                const sec = item.secao || 'Outros';
                if (!groups[sec]) groups[sec] = [];
                groups[sec].push(item);
            }

            const orderedSecs = Object.keys(groups).sort((a, b) => {
                const ia = groupOrder.indexOf(a);
                const ib = groupOrder.indexOf(b);
                return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
            });

            const checkedCount = itens.filter(i => marcados.has(i.alimento_id)).length;
            const pct = itens.length > 0 ? (checkedCount / itens.length) * 100 : 0;
            $progressBar.style.width = pct + '%';
            $progressText.textContent = `${checkedCount} de ${itens.length} marcados`;

            const html = orderedSecs.map(sec => {
                const items = groups[sec];
                const isExtra = sec === 'Variar' || sec === 'Recompensa';
                const badge = isExtra ? `<span class="lc-badge">${escapeHtml(sec)}</span>` : '';
                const title = isExtra ? sec : sec;
                return `
                    <div class="lc-card">
                        <div class="lc-section-title">${escapeHtml(title)} ${badge}</div>
                        ${items.map(item => {
                            const checked = marcados.has(item.alimento_id);
                            const qty = item.medida_caseira || (item.comprar_g ? `${Math.round(item.comprar_g)} g` : '');
                            return `
                                <div class="lc-item ${checked ? 'checked' : ''}" data-id="${escapeHtml(item.alimento_id)}">
                                    <button class="lc-checkbox ${checked ? 'checked' : ''}" data-toggle="${escapeHtml(item.alimento_id)}" aria-label="Marcar ${escapeHtml(item.nome)}"></button>
                                    <div class="lc-item-body">
                                        <div class="lc-item-name">${escapeHtml(item.nome)}</div>
                                        ${qty ? `<div class="lc-item-meta">${escapeHtml(qty)}</div>` : ''}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }).join('');

            $content.innerHTML = html;

            // Attach handlers
            $content.querySelectorAll('[data-toggle]').forEach(btn => {
                btn.addEventListener('click', () => toggleItem(btn.dataset.toggle, btn));
            });
        }

        // ----- Toggle item -----
        async function toggleItem(alimentoId, btnEl) {
            const wasMarked = marcados.has(alimentoId);
            const newValue = !wasMarked;

            // Optimistic UI
            if (newValue) marcados.add(alimentoId);
            else marcados.delete(alimentoId);
            render();
            btnEl.disabled = true;

            try {
                // Upsert (insert or update)
                const { error } = await client
                    .from('lista_compartilhada_marcacao')
                    .upsert({
                        lista_id: listaId,
                        alimento_id: alimentoId,
                        marcado: newValue,
                        marcado_at: new Date().toISOString()
                    }, { onConflict: 'lista_id,alimento_id' });

                if (error) {
                    // Rollback
                    if (newValue) marcados.delete(alimentoId);
                    else marcados.add(alimentoId);
                    render();
                    console.warn('toggle error:', error);
                    alert('Não foi possível salvar. Tente novamente.');
                }
            } catch (err) {
                if (newValue) marcados.delete(alimentoId);
                else marcados.add(alimentoId);
                render();
                console.warn('toggle exception:', err);
            } finally {
                btnEl.disabled = false;
            }
        }

        // ----- Load lista + marcacoes -----
        async function loadAll() {
            if (!token) {
                showError('Link inválido. Faltou o token na URL.');
                return;
            }

            // Naive UUID v4-ish format check
            if (!/^[0-9a-f-]{32,36}$/i.test(token)) {
                showError('Link inválido (token mal formado).');
                return;
            }

            try {
                const { data: lista, error: listaErr } = await client
                    .from('lista_compartilhada')
                    .select('id, token, itens, expira_em, created_at')
                    .eq('token', token)
                    .maybeSingle();

                if (listaErr) {
                    showError('Erro ao carregar lista: ' + listaErr.message);
                    return;
                }
                if (!lista) {
                    showError('Link não encontrado ou expirado. Peça uma lista nova.');
                    return;
                }

                listaId = lista.id;
                itens = Array.isArray(lista.itens) ? lista.itens : [];

                // Subtitle: created_at relative
                try {
                    const created = new Date(lista.created_at);
                    const expira = new Date(lista.expira_em);
                    const diasRestantes = Math.max(0, Math.ceil((expira - new Date()) / 86400000));
                    $subtitle.textContent = `via Livowa · expira em ${diasRestantes} ${diasRestantes === 1 ? 'dia' : 'dias'}`;
                } catch {}

                // Fetch marcacoes
                const { data: marcs, error: marcsErr } = await client
                    .from('lista_compartilhada_marcacao')
                    .select('alimento_id, marcado')
                    .eq('lista_id', lista.id);

                if (!marcsErr && Array.isArray(marcs)) {
                    marcados = new Set(marcs.filter(m => m.marcado).map(m => m.alimento_id));
                }

                render();
            } catch (err) {
                showError('Erro inesperado: ' + (err.message || err));
            }
        }

        // ----- Lightweight polling (only when tab visible) -----
        let pollTimer = null;
        function startPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(() => {
                if (!document.hidden && listaId) refreshMarcacoes();
            }, POLL_INTERVAL_MS);
        }

        async function refreshMarcacoes() {
            if (!listaId) return;
            try {
                const { data, error } = await client
                    .from('lista_compartilhada_marcacao')
                    .select('alimento_id, marcado')
                    .eq('lista_id', listaId);
                if (!error && Array.isArray(data)) {
                    const next = new Set(data.filter(m => m.marcado).map(m => m.alimento_id));
                    // Only re-render if changed
                    if (next.size !== marcados.size || [...next].some(x => !marcados.has(x))) {
                        marcados = next;
                        render();
                    }
                }
            } catch (e) {
                // ignore
            }
        }

        $refreshBtn.addEventListener('click', () => {
            $refreshBtn.disabled = true;
            $refreshBtn.textContent = 'Atualizando...';
            refreshMarcacoes().finally(() => {
                $refreshBtn.disabled = false;
                $refreshBtn.textContent = 'Atualizar';
            });
        });

        // Boot
        loadAll().then(startPolling);
    </script>
</body>
</html>
