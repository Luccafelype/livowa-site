<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O seu passo a passo · Livowa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<!-- 23/11 (Lucca: "Quero o passo a passo… nesse meio tempo o sistema já tem que ter feito… um vídeo, um PDF, uma arte
     interativa"): a página só dela, montada pelo link que a Caixa gera (?d=desejo&f=faixa&i=idade). Sem dado pessoal no
     servidor: tudo vem do link. Conteúdo: passo/conteudo.json, gerado de tarefas/passo-a-passo/rascunho-conteudo.md
     (livowa-empresa) por gerar_conteudo.py. O texto é conduta médica: vale o que o Dr. Lucca aprovou. -->
<style>
:root{
  --bg:#f2f4f1; --surface:#ffffff; --fg:#141c17; --muted:#5f6d65; --line:#dbe1dc;
  --accent:#0d6a4d; --accent-2:#d9efe5; --on-accent:#ffffff; --warn:#8a5200; --warn-bg:#f7ecdc;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:22px max(18px,env(safe-area-inset-left)) 60px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);margin:0;line-height:1.08;text-wrap:balance}
h1{font-size:clamp(1.9rem,8vw,2.4rem);font-weight:800;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--accent)}
h2{font-size:1.3rem;font-weight:700}
p{margin:0}
.who{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.who img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.who b{color:var(--fg);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card.verde{background:var(--accent);color:var(--on-accent);border:0}
.card.aviso{background:var(--warn-bg);border-color:#ead7b8}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.semanas{display:flex;flex-direction:column;gap:10px}
.sem{border-left:4px solid var(--accent);background:var(--surface);border-radius:0 12px 12px 0;padding:12px 14px}
.sem.cuidado{border-left-color:var(--warn);background:var(--warn-bg)}
.ex{display:flex;flex-direction:column;gap:8px}
.ex details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
.ex summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
.ex summary::-webkit-details-marker{display:none}
.ex summary::after{content:"+";color:var(--accent);font-weight:700}
.ex details[open] summary::after{content:"–"}
.ex details p{padding:0 0 12px}
.rot{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fontes{font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>
<main id="app">
  <div class="who"><img src="/assets/img/dr-lucca-avatar.jpg" alt=""><span><b>Dr. Lucca Marques</b> · Médico · CRM-GO 33.990</span></div>
  <h1 id="tit">O seu passo a passo</h1>
  <noscript><p>Abra este link no navegador do celular.</p></noscript>
</main>
<script>
const P = new URLSearchParams(location.search);
const DES = ['chegar10', 'firme', 'disposicao', 'devagar', 'independente'].includes(P.get('d')) ? P.get('d') : 'chegar10';
const FX = ['abaixo', 'linha', 'acima'].includes(P.get('f')) ? P.get('f') : 'linha';
const IDADE = Math.max(18, Math.min(99, parseInt(P.get('i'), 10) || 40)), N = IDADE + 10;
// o mesmo texto do braço (braco/index.html, FUT_EU)
const DESEJO = { chegar10:`chegar aos ${N} com corpo de atleta`, firme:'ter braços firmes e fortes', disposicao:'ter a mesma disposição de hoje',
  devagar:'envelhecer mais devagar', independente:'não depender de ninguém' }[DES];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const campos = s => s.replace(/\{idade\}/g, IDADE).replace(/\{N\}/g, N).replace(/\{desejo\}/g, DESEJO);
const inl = s => esc(campos(s)).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const pars = (lista, cls = '') => lista.map(b => b.itens ? `<ul>${b.itens.map(x => `<li>${inl(x)}</li>`).join('')}</ul>` : `<p${cls}>${inl(b.t)}</p>`).join('');
const sec = (rot, html, cls = 'card') => `<section class="${cls}">${rot ? `<p class="rot">${rot}</p>` : ''}${html}</section>`;
fetch('conteudo.json?v=1').then(r => r.json()).then(C => {
  const app = document.getElementById('app');
  document.getElementById('tit').innerHTML = `O seu passo a passo para <em>${esc(DESEJO)}</em>`;
  const passo = C.passo[DES], lista = passo[0] && passo[0].t || '';
  const nomes = lista.toLowerCase();
  const exs = C.exercicios.filter(b => { const m = /^\*\*(.+?)\.\*\*/.exec(b.t || ''); if (!m) return false;
    const n = m[1].toLowerCase(); return n.startsWith('na academia') || nomes.includes(n); });
  let h = '';
  h += sec('', pars(C.abertura[FX]));
  h += sec('Por que funciona', pars(C.porque[DES]));
  h += sec('O que os protocolos dizem', pars(C.protocolos.slice(1)) + '<p class="fontes">Consenso internacional de exercício para idosos (Izquierdo e colegas, 2021) · Diretrizes da Organização Mundial da Saúde (2020) · Revisão de 2022 sobre treino de potência</p>');
  h += `<h2>Semana a semana</h2><div class="semanas">${passo.map((b, k) => {
    const cuidado = /^\*\*Cuidado/.test(b.t || '');
    return `<div class="sem${cuidado ? ' cuidado' : ''}">${pars([b])}</div>`; }).join('')}</div>`;
  h += `<h2>Como fazer cada movimento</h2>` + sec('', pars(C.regras));
  h += `<div class="ex">${exs.map(b => { const m = /^\*\*(.+?)\.\*\*\s*(.*)$/.exec(b.t);
    return `<details><summary>${esc(m[1])}</summary><p>${inl(m[2])}</p></details>`; }).join('')}</div>`;
  if (DES === 'chegar10' || DES === 'firme') h += sec('E a comida', pars(C.proteina));
  h += sec('Antes de começar', pars(C.seguranca), 'card aviso');
  h += sec('', pars(C.fecho), 'card verde');
  app.insertAdjacentHTML('beforeend', h);
}).catch(() => document.getElementById('app').insertAdjacentHTML('beforeend', '<p>Não consegui abrir o seu passo a passo. Tente de novo em alguns segundos.</p>'));
</script>
</body>
</html>
