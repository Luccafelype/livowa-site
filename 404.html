<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; worker-src 'none'; form-action 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; upgrade-insecure-requests">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <script src="/assets/js/boot.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada | Livowa</title>
    <!--
      SPA-style fallback para /lista/{token}.
      GitHub Pages serve este 404.html quando o path não corresponde a um arquivo.
      Se o path for /lista/<algo>, redirecionamos pra /lista/?token=<algo>
      (que é servido pelo /lista/index.html) — sem o usuário ver esta página.
    -->
    <script src="/assets/js/404.js"></script>
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="container">
        <a href="/" class="logo">Livowa</a>
        <nav>
            <a href="/suporte">Suporte</a>
            <a href="/privacidade">Privacidade</a>
            <a href="/termos">Termos</a>
        </nav>
    </header>
    <main>
        <section class="hero container">
            <h1>Página não encontrada</h1>
            <p>O endereço que você procurou não existe ou foi movido.</p>
            <div class="hero-actions">
                <a href="/" class="btn btn-primary">Voltar para o início</a>
                <a href="/suporte" class="btn btn-outline">Falar com o suporte</a>
            </div>
        </section>
    </main>
</body>
</html>
