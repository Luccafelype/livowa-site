<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada | Livowa</title>
    <!--
      SPA-style fallback para /lista/{token}.
      GitHub Pages serve este 404.html quando o path não corresponde a um arquivo.
      Se o path for /lista/<algo>, redirecionamos pra /lista/?token=<algo>
      (que é servido pelo /lista/index.html) — sem o usuário ver esta página.
    -->
    <script>
      (function () {
        try {
          var parts = location.pathname.split('/').filter(Boolean);
          if (parts.length >= 2 && parts[0] === 'lista') {
            var token = parts[1];
            if (token && token !== 'index.html') {
              location.replace('/lista/?token=' + encodeURIComponent(token));
            }
          }
        } catch (e) { /* fall through to 404 page */ }
      })();
    </script>
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="container">
        <a href="/" class="logo">Livowa</a>
        <nav>
            <a href="/suporte">Suporte</a>
            <a href="/privacidade">Privacidade</a>
            <a href="/termos">Termos</a>
        </nav>
    </header>
    <main>
        <section class="hero container">
            <h1>Página não encontrada</h1>
            <p>O endereço que você procurou não existe ou foi movido.</p>
            <div class="hero-actions">
                <a href="/" class="btn btn-primary">Voltar para o início</a>
                <a href="/suporte" class="btn btn-outline">Falar com o suporte</a>
            </div>
        </section>
    </main>
</body>
</html>
