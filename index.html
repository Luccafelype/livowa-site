<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livowa — Acompanhamento Nutricional Inteligente</title>
  <meta name="description" content="Livowa — acompanhamento nutricional inteligente. Em breve.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 24px;
    }

    /* Logo mark — composed from the 3 SVG parts */
    .logo-mark {
      position: relative;
      width: 104px;
      height: 115px;
    }

    .logo-mark .bg {
      position: absolute;
      inset: 0;
    }

    .logo-mark .stroke {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -55%);
    }

    .logo-mark .swoosh {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
    }

    .logo-text {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #1a1a1a;
      margin-top: 12px;
    }

    .tagline {
      font-size: 1.125rem;
      font-weight: 400;
      color: #666;
      text-align: center;
      line-height: 1.6;
      max-width: 380px;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #e0e0e0;
      border-radius: 1px;
    }

    footer {
      position: fixed;
      bottom: 32px;
      font-size: 0.8125rem;
      color: #aaa;
      letter-spacing: 0.02em;
    }

    @media (max-width: 480px) {
      .logo-text { font-size: 1.625rem; }
      .tagline { font-size: 1rem; max-width: 300px; }
      footer { bottom: 24px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <!-- Logo mark -->
    <div class="logo-mark">
      <!-- Background rectangle -->
      <svg class="bg" width="104" height="115" viewBox="0 0 104 115" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="104" height="115" rx="8" fill="white"/>
        <rect x="0.5" y="0.5" width="103" height="114" rx="7.5" stroke="#2F2F2F" stroke-opacity="0.09"/>
      </svg>
      <!-- Vertical stroke -->
      <svg class="stroke" width="19" height="75" viewBox="0 0 19 75" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4.86122 60.2947C4.84604 45.3174 4.79448 30.8333 4.82904 16.3493C4.83961 11.9143 4.73125 7.62423 0 4.13078C6.19585 2.7255 12.3917 1.32022 18.2125 0C14.3253 20.1562 16.8735 40.0261 16.3498 59.7638C16.0728 70.2045 15.3144 71.4954 3.931 74.6663C4.80119 69.9217 4.79832 65.3542 4.86122 60.2947Z" fill="black"/>
      </svg>
      <!-- Swoosh -->
      <svg class="swoosh" width="63" height="21" viewBox="0 0 63 21" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M52.2603 20.0657C34.6705 18.6115 17.4751 17.5235 0.599473 19.5873C-0.616408 17.3201 0.198594 16.3118 1.43253 15.5792C10.1631 10.3955 19.1299 6.40104 29.769 8.47172C34.152 9.32479 38.6991 9.65789 43.1709 9.65373C49.3845 9.64793 55.0066 7.89581 58.7673 2.34846C59.4636 1.3213 59.9409 -0.161841 61.6654 0.0143678C63.6702 4.53671 57.9424 17.247 52.2603 20.0657Z" fill="black"/>
      </svg>
    </div>

    <!-- Brand name -->
    <span class="logo-text">Livowa</span>

    <div class="divider"></div>

    <!-- Tagline -->
    <p class="tagline">Em breve — acompanhamento nutricional inteligente</p>
  </main>

  <footer>livowa.com</footer>
</body>
</html>
